<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Trilhas - Cyber Academy</title>
    <link rel="stylesheet" href="../assets/css/ava.css">
</head>
<body>
    <div class="ava-layout">
        <div id="sidebar"></div>
        
        <main class="main-content">
            <div class="container">
                <header style="margin-bottom: 2rem;">
                    <div class="flex flex-between flex-center">
                        <div>
                            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">📚 Minhas Trilhas</h1>
                            <p style="color: var(--text-gray);">Acompanhe seu progresso em cada curso</p>
                        </div>
                        <a href="../matricula.html" class="btn btn-primary">+ Nova Matrícula</a>
                    </div>
                </header>

                <div class="grid grid-3" id="trilhasGrid">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/ava.js"></script>
    <script>
        if (!Auth.requireAluno()) throw new Error('Não autorizado');

        const user = Auth.getCurrentUser();
        document.getElementById('sidebar').innerHTML = Auth.buildSidebar(user, 'minhas-trilhas');

        document.addEventListener('DOMContentLoaded', () => {
            const matriculas = DataManager.getMatriculasByUserId(user.id);
            const grid = document.getElementById('trilhasGrid');

            if (matriculas.length === 0) {
                grid.innerHTML = `
                    <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
                        <h3>Você ainda não tem matrículas</h3>
                        <p style="color: var(--text-gray); margin: 1rem 0;">Escolha uma trilha e comece a estudar!</p>
                        <a href="../matricula.html" class="btn btn-primary">Ver Trilhas Disponíveis</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = matriculas.map(matricula => {
                const trilha = DataManager.getTrilhaById(matricula.trilhaId);
                if (!trilha) return '';

                const progresso = AVA.calcularProgressoTrilha(user.id, trilha.id);

                return `
                    <div class="card">
                        <img src="${trilha.imagem}" alt="${trilha.titulo}" 
                             style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem;">
                        <h3>${trilha.titulo}</h3>
                        <p style="color: var(--text-gray); font-size: 0.9rem; margin: 0.5rem 0;">${trilha.descricao}</p>
                        
                        <div style="margin: 1.5rem 0;">
                            <div class="flex flex-between mb-1">
                                <span>Progresso</span>
                                <span style="color: var(--primary); font-weight: 600;">${progresso}%</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-fill" style="width: ${progresso}%"></div>
                            </div>
                        </div>

                        <div class="flex gap-1">
                            <a href="trilha.html?id=${trilha.id}" class="btn btn-primary btn-sm" style="flex: 1;">
                                ${progresso > 0 ? 'Continuar' : 'Começar'}
                            </a>
                            <a href="certificados.html" class="btn btn-secondary btn-sm">
                                🏆
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
